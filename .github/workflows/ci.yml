name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # ratchet:dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # ratchet:Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # tilth-core must package on its own: tilth depends on it by version, so
      # a release publishes it to crates.io first.
      - run: cargo publish --dry-run --locked -p tilth-core

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - uses: nosborn/github-action-markdown-cli@508d6cefd8f0cc99eab5d2d4685b1d5f470042c1 # ratchet:nosborn/github-action-markdown-cli@v3.5.0
        with:
          files: prompts/ AGENTS.md
          config_file: .markdownlint.json
      - name: AGENTS.md is regenerated from prompts/
        # Re-running the regen script must be a no-op. If AGENTS.md drifts from
        # prompts/*.md (someone edited the markdown but forgot to re-run the
        # script), this step fails and surfaces the missing regen in the PR.
        run: bash ./scripts/regen-agents-md.sh && git diff --exit-code AGENTS.md
