[package]
name = "tilth-core"
version = "0.13.0"
edition = "2021"
description = "The parsing substrate under tilth: tree-sitter outlines, language detection, imports, call sites and file-level dependencies."
license = "MIT"
repository = "https://github.com/jahala/tilth"
homepage = "https://jahala.github.io/tilth/"
readme = "README.md"
keywords = ["tree-sitter", "code-search", "outline", "developer-tools"]
categories = ["development-tools", "parser-implementations"]

[lints]
workspace = true

[features]
# Source fixtures the tilth binary's tests share with this crate's tests.
# Enabled only by tilth's dev-dependency, so it never reaches a release build.
test-fixtures = []

[dependencies]
# Tree-sitter (AST outlines)
tree-sitter = { workspace = true }
tree-sitter-language = "0.1"
streaming-iterator = { workspace = true }
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.25"
tree-sitter-scala = "0.26"
tree-sitter-c-sharp = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-elixir = "0.3"
tree-sitter-bash = "0.25.1"
tree-sitter-md = "0.5"

# The shared directory walker (ripgrep's ignore rules)
ignore = { workspace = true }

# Byte scanning (SIMD-accelerated)
memchr = { workspace = true }

# Concurrent cache
dashmap = { workspace = true }

# Error types
thiserror = "2"

# Bloom filter (fast SIMD-optimized impl)
fastbloom = "0.17"

# Read opens: O_NONBLOCK so a pipe with no writer cannot block the open,
# cleared again on a regular file's handle
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = { workspace = true }
