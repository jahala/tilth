# core — tilth-core, the parser as a library
**Goal.** A `tilth-core` library crate in a Cargo workspace beside the `tilth` binary, carrying tree-sitter outlines, the symbol index and search, callers and callees, dependency analysis and blast radius, and file classification including `is_test_file` and generated and binary detection. weed depends on it as a git dependency pinned to a commit until the owner publishes it; the tilth binary is its first consumer. Its documented public surface is exactly what weed asked for on the channel, nothing speculative, and the split changes no behaviour of the binary.

## The seam

The public API is negotiated with weed's builder, peer bandung, not guessed. What the tilth binary needs beyond that surface travels through a `#[doc(hidden)]` module, the pattern the crate already uses for its fuzz harness, so the documented API stays small while the binary keeps every internal path it had.

## Tests
- [ ] (code) `tilth-core` builds alone as a library and its dependency tree carries no CLI or MCP crate: clap, clap_complete, terminal_size, home, percent-encoding · scripts/check/core-deps.sh
- [ ] (code) an external test compiles against every function and type in the negotiated API list, and `cargo doc` with missing docs denied passes for the documented surface · scripts/check/core-api.sh
- [ ] (code) the workspace runs at least the 654 tests v0.10.1 ran (650 in the library, 4 in the binary), all passing, none ignored · scripts/check/test-count.sh
- [ ] (code) the library introduces no dependency the v0.10.1 package did not already carry: the set of package names in Cargo.lock equals the set at tag v0.10.1 · scripts/check/no-new-deps.sh
- [ ] (human) bandung confirms on the channel that the exposed API covers weed's rules, and weed pins the commit named in the handback
