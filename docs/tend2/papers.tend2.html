# papers — the bed's manifest, brand layer, and footer
**Goal.** The files that let the umbrella verify tilth belongs to the garden: `garden.json` at the root declaring what tilth is, how it installs, how it is measured, and what it costs an agent in context; `.brand/products/tilth/` in the umbrella's product shape; a landing-page footer that lists every bed; and a committed result for the declared metric. The umbrella's fit checks F1, F3, F4, F5, and F6 read these files; this loop makes them true.

## Tests
- [ ] (code) `garden.json` parses and declares name, kind, version equal to both `Cargo.toml` and `npm/package.json`, faces, install per platform, metric command, and a declared context cost no lower than the measured one · scripts/check/garden-json.sh
- [ ] (code) `.brand/products/tilth/` carries identity, colors, and voice in the shape the umbrella's other products use · scripts/check/brand-layer.sh
- [ ] (code) the landing page footer names every bed of the garden · scripts/check/footer.sh
- [ ] (code) the metric result the page and README cite is committed under `benchmark/results/` with the version it was measured on · scripts/check/metric-result.sh
- [ ] (code) the release workflow publishes `tilth-core` to crates.io before `tilth` and holds both crate versions to the tag · scripts/check/release-order.sh
- [ ] (human) the owner decides the footer's entry for the judge once its name is confirmed
