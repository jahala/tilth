# tilth — the reader, and the parser the judge uses
**Goal.** tilth stays what it is, structural reading of code for agents with a measured cost-per-correct gain, and becomes the parsing substrate the garden's judge is built on. Three bets on this map: a `tilth-core` library crate that weed depends on, landed with zero behaviour change; an instruction block that moves into `skills/SKILL.md` so tilth costs an agent nothing at startup; and the bed's papers, the manifest, brand layer, and footer the umbrella verifies. The umbrella's fit checks live on plotplot's map; this map holds whether the modules work.

## One parser, two consumers

weed needs outlines, symbol search, callers, dependency analysis, and test-file classification in fourteen languages. Copying that into a second crate would fork the parser and every grammar bump twice over. A library crate in this repository ([core](core.tend2.html)) keeps one parser with two consumers, and the tilth binary is the first of them, which is what makes a byte-identical output proof possible: the same code path, linked from another crate. Evidence on this map is shell; the verifier runs it with `tend2 verify <loop> --runner "bash {evidence}"`.
