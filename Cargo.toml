[package]
name = "tilth"
version = "0.13.0"
edition = "2021"
description = "Smart code reading for AI agents. Definitions, callers, deps and function-level diffs from tree-sitter."
license = "MIT"
repository = "https://github.com/jahala/tilth"
homepage = "https://jahala.github.io/tilth/"
readme = "README.md"
keywords = ["mcp", "code-search", "tree-sitter", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[workspace]
members = ["crates/tilth-core"]
exclude = ["fuzz"]

# Each dependency both crates use is declared here once, so the two can
# never drift to different requirements.
[workspace.dependencies]
tree-sitter = "0.27"
streaming-iterator = "0.1"
ignore = "0.4"
memchr = "2"
dashmap = "6"
tempfile = "3"

# One lint policy for both crates. CI runs clippy with -D warnings, so every
# warning here fails the build. An exception is an item-level
# #[expect(lint, reason = "...")], which itself fails once the code it
# excuses is gone.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Project conventions, allowed everywhere. tree-sitter reports rows and
# columns as usize, while its own APIs and our line numbers use u32 and i32.
# tilth targets 64-bit hosts and source files far below 4 GiB, so these
# conversions cannot lose a real value.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Parser and search code names related values alike (start and end, node and
# nodes).
similar_names = "allow"
# The pub items are internal API between the two crates. Their error and
# panic behaviour is documented where it is surprising, not by rote.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# A curated nursery subset, each precise on this codebase.
redundant_clone = "warn"
use_self = "warn"
or_fun_call = "warn"
needless_collect = "warn"
option_if_let_else = "warn"

# Restrictions. clippy.toml exempts #[test] functions and #[cfg(test)]
# modules from the unwrap, expect, print and dbg lints; a helper function in
# tests/*.rs needs its own #[expect]. An exception is an #[expect] with a
# reason on the item or statement it excuses, which fails once its violation
# is gone; allow_attributes forbids #[allow]. The reason names the issue
# that removes the exception, or starts with "by design: " for a permanent
# one; tests/expect_reasons.rs holds that.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[[bin]]
name = "tilth"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The parsing substrate: language detection, outlines, imports, callers, deps
tilth-core = { path = "crates/tilth-core", version = "0.13.0" }

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Tree-sitter types the read, search, diff and edit layers still name
tree-sitter = { workspace = true }
streaming-iterator = { workspace = true }

# Search (ripgrep internals)
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = { workspace = true }
globset = "0.4"

# Regex escaping (transitive dep of grep-regex, used directly for literal search)
regex-syntax = "0.8"

# Byte scanning (SIMD-accelerated)
memchr = { workspace = true }
memmap2 = "0.9"

# Parallelism
rayon = "1"

# Channel with select! for the timeout wrapper (sibling of crossbeam-deque/-utils
# already pulled in transitively by rayon; gives the closer-to-Java-Future
# ergonomics that std::sync::mpsc::recv_timeout cannot express on multiple arms).
crossbeam-channel = "0.5"

# Concurrent map for the editor's per-file locks
dashmap = { workspace = true }

# Structured data parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# MCP protocol (JSON-RPC over stdio)
# (handled manually — no framework needed)

# String similarity (char-aware Levenshtein for filename / heading suggestions)
strsim = "0.11"

# URI percent-decoding (file:// roots from MCP host)
percent-encoding = "2.3"

# Cross-platform home directory lookup (cargo-team maintained)
home = "0.5"

# Terminal size detection (TIOCGWINSZ ioctl, falls back to env vars)
terminal_size = "0.4"

# O_NOFOLLOW open flag for tilth_write's overwrite path (refuse symlink follow)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
# tests/expect_reasons.rs parses every source file to read its #[expect] reasons
syn = { version = "2", features = ["full", "visit"] }
tilth-core = { path = "crates/tilth-core", version = "0.13.0", features = ["test-fixtures"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false

[profile.release.build-override]
opt-level = 2

# Optimized but fast to compile, for timing runs during development
[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 8
strip = false
