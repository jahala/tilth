[package]
name = "tilth"
version = "0.10.1"
edition = "2021"
description = "Tree-sitter indexed lookups — smart code reading for AI agents"
license = "MIT"
repository = "https://github.com/jahala/tilth"
readme = "README.md"
keywords = ["mcp", "code-search", "tree-sitter", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[workspace]
members = [".", "crates/tilth-core"]
exclude = ["fuzz"]

[[bin]]
name = "tilth"
path = "src/main.rs"

[dependencies]
# The parsing substrate: outlines, language detection, symbol/callers/deps queries
tilth-core = { path = "crates/tilth-core", version = "0.10.1" }

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Tree-sitter types still named by the diff and formatting layers
tree-sitter = "0.26"
streaming-iterator = "0.1"

# Search (ripgrep internals) — content / regex search
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
globset = "0.4"

# Regex escaping (transitive dep of grep-regex, used directly for literal search)
regex-syntax = "0.8"

# Byte scanning (SIMD-accelerated)
memchr = "2"
memmap2 = "0.9"

# Parallelism
rayon = "1"

# Concurrent map for the editor's per-file locks
dashmap = "6"

# Channel with select! for the timeout wrapper (sibling of crossbeam-deque/-utils
# already pulled in transitively by rayon; gives the closer-to-Java-Future
# ergonomics that std::sync::mpsc::recv_timeout cannot express on multiple arms).
crossbeam-channel = "0.5"

# Structured data parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# MCP protocol (JSON-RPC over stdio)
# (handled manually — no framework needed)

# String similarity (char-aware Levenshtein for filename / heading suggestions)
strsim = "0.11"

# URI percent-decoding (file:// roots from MCP host)
percent-encoding = "2.3"

# Cross-platform home directory lookup (cargo-team maintained)
home = "0.5"

# Terminal size detection (TIOCGWINSZ ioctl, falls back to env vars)
terminal_size = "0.4"

# O_NOFOLLOW open flag for tilth_write's overwrite path (refuse symlink follow)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false

[profile.release.build-override]
opt-level = 2

# Optimized but fast to compile — for benchmarking during development
[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 8
strip = false
