# Tests may unwrap, expect, print and dbg: a panic there is the failure report.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true

# Diagnostics have one sink, `diag::emit`; `print_stderr` covers the macros.
disallowed-methods = [
  { path = "std::io::stderr", reason = "write diagnostics through `diag::emit`" },
]
