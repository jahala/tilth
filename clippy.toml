# #[test] functions and #[cfg(test)] modules may unwrap, expect, print and
# dbg: a panic there is the failure report. A helper function in tests/*.rs is
# neither, so it needs its own #[expect].
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true

# Every read of a file a walk or a caller names goes through
# `tilth_core::source::OpenFile` (or `source::read`, `read_to_string`,
# `read_source`), whose open never waits on a pipe and which reads a pipe,
# socket or device as empty.

# Each stream has one sink: results go through `write_stdout` (CLI) or the
# MCP transport's writer, diagnostics through `diag::emit`. `print_stdout`
# and `print_stderr` cover the macros.

# Every directory walk starts from `tilth_core::search::walk`, so each one
# skips `SKIP_DIRS` and `.tilthignore` and follows the gitignore setting.

# The environment is read in one place, `tilth::config::env_var`, and never
# written: `main` builds one `Config` from it and passes it down.
disallowed-methods = [
  { path = "std::env::var", reason = "read the environment through `tilth::config::env_var`; settings come from `Config`" },
  { path = "std::env::var_os", reason = "read the environment through `tilth::config::env_var`; settings come from `Config`" },
  { path = "std::env::vars", reason = "read the environment through `tilth::config::env_var`; settings come from `Config`" },
  { path = "std::env::vars_os", reason = "read the environment through `tilth::config::env_var`; settings come from `Config`" },
  { path = "std::env::set_var", reason = "the environment is process-global; pass settings in a `Config`" },
  { path = "std::env::remove_var", reason = "the environment is process-global; pass settings in a `Config`" },
  { path = "std::io::stdout", reason = "write results through `write_stdout` (CLI) or the MCP transport's writer" },
  { path = "std::io::stderr", reason = "write diagnostics through `diag::emit`" },
  { path = "std::fs::read", reason = "read through `tilth_core::source`, whose open never waits on a pipe" },
  { path = "std::fs::read_to_string", reason = "read through `tilth_core::source`, whose open never waits on a pipe" },
  { path = "std::fs::File::open", reason = "open through `tilth_core::source::OpenFile`, which never waits on a pipe" },
  { path = "ignore::WalkBuilder::new", reason = "walk through `tilth_core::search::walk`, which holds the one ignore policy" },
  { path = "ignore::Walk::new", reason = "walk through `tilth_core::search::walk`, which holds the one ignore policy" },
]
